  <script>

    function copyText(text) {

      navigator.clipboard.writeText(text).then(function() {

        const notification =
          document.getElementById("notification");

        notification.classList.add("show");

        setTimeout(function() {
          notification.classList.remove("show");
        }, 1800);

      }).catch(function() {

        alert("Nomor: " + text);

      });

    }

  </script>
